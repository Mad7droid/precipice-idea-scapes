<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Precipice</title>
    <link rel="icon" type="image/png" href="/precipice-mark.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Pixel&family=Inter:opsz,wght@14..32,400..600&display=swap"
      rel="stylesheet"
    />

    <!--
      The public viewer. A separate HTML entry, not a route inside the app: two Vite inputs
      mean two independent module graphs, so "the viewer ships no AI SDK, no store and no
      Dexie" is a property of the build rather than something a test has to go looking for.

      Theme follows the OS and nothing else. The app mirrors its stored preference into
      localStorage for its own pre-paint script; a stranger opening a published link has no
      stored preference, and reading one would be reaching into the author's app state from
      a page that is deliberately not allowed to.
    -->
    <script>
      (function () {
        if (!window.matchMedia("(prefers-color-scheme: dark)").matches) return;
        document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = "dark";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/viewer/main.tsx"></script>
  </body>
</html>
