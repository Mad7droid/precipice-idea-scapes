name = "precipice-publications"
main = "worker/publish/index.ts"
compatibility_date = "2026-08-02"
compatibility_flags = ["nodejs_compat"]

[placement]
mode = "smart"

[[d1_databases]]
binding = "PUBLISH_DB"
database_name = "precipice-publications"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "worker/publish/migrations"

[[r2_buckets]]
binding = "PUBLICATIONS"
bucket_name = "precipice-publications"

# Create a production namespace in the Cloudflare dashboard, then replace this placeholder.
[[unsafe.bindings]]
name = "PUBLISH_LIMIT"
type = "ratelimit"
namespace_id = "REPLACE_WITH_RATE_LIMIT_NAMESPACE_ID"
simple = { limit = 30, period = 60 }

[vars]
APP_ORIGIN = "https://precipice.pages.dev"
# GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET are Wrangler secrets, never committed.

[triggers]
crons = ["0 * * * *"]
