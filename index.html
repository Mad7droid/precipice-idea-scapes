<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Precipice</title>
    <link rel="icon" type="image/png" href="/precipice-mark.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Pixel&family=Inter:opsz,wght@14..32,400..600&display=swap"
      rel="stylesheet"
    />

    <!--
      Theme is applied before first paint. A flash of the wrong theme is a bug.
      IndexedDB is async, so the resolved preference is mirrored into localStorage
      by src/persistence/settings.ts purely so this script can read it synchronously.
    -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("precipice.theme") || "system";
          var dark =
            pref === "dark" ||
            (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* private mode / storage disabled — fall through to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
