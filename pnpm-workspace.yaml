allowBuilds:
  # Transitive via jspdf. Its install script only prints a funding notice — nothing to run.
  core-js: false
  # Transitive via a polyfill dep. Same funding-notice-only install script as core-js.
  core-js-pure: false
  esbuild: true
  # Wrangler's locally bundled Cloudflare runtime.
  workerd: true

# Transitive via @ai-sdk/*. Not reachable from browser code, but it carries advisories and
# pinning it forward costs nothing. pnpm 11 reads overrides here, not from package.json.
overrides:
  undici: ">=6.27.0"
  # Dev-only, all three: they reach the tree through @modelcontextprotocol/sdk's express and
  # ajv trees and a build-time vite chain, and none of them is in `pnpm audit --prod`. Pinned
  # forward anyway — each patch is inside the major the parent already asks for.
  fast-uri: ">=3.1.6"
  nanoid: ">=3.3.18"
  qs: ">=6.16.0"
