allowBuilds:
  # Transitive via jspdf. Its install script only prints a funding notice — nothing to run.
  core-js: false
  # Transitive via a polyfill dep. Same funding-notice-only install script as core-js.
  core-js-pure: false
  esbuild: true
  # Wrangler's locally bundled Cloudflare runtime.
  workerd: true

# Transitive via @ai-sdk/*. Not reachable from browser code, but it carries advisories and
# pinning it forward costs nothing. pnpm 11 reads overrides here, not from package.json.
overrides:
  undici: ">=8.12.2 <9"
  # Transitive via jspdf (html() sanitising only). Patch release inside the same major.
  dompurify: ">=3.4.17 <4"
  # Dev-only, all three: they reach the tree through @modelcontextprotocol/sdk's express and
  # ajv trees and a build-time vite chain, and none of them is in `pnpm audit --prod`. Pinned
  # forward anyway — each patch is inside the major the parent already asks for.
  fast-uri: ">=4.2.3 <5"
  nanoid: ">=3.3.18"
  qs: ">=6.16.1 <7"
  # Security patches for the MCP SDK and Wrangler development dependencies.
  hono: ">=4.13.11 <5"
  "@hono/node-server": ">=2.1.3 <3"
  sharp: ">=0.35.5 <0.36"
  # November 2026 Dependabot sweep. All dev/build-time only (MCP SDK express tree, Tailwind/
  # PostCSS, Vitest); each pin stays inside the major its parent already requests.
  proxy-addr: ">=2.0.8 <3"
  body-parser: ">=2.4.0 <3"
  ip-address: ">=10.7.1 <11"
  source-map-js: ">=1.2.2 <2"
  postcss-selector-parser: ">=6.1.5 <7"
  "@vitest/mocker": ">=4.1.12 <5"
