name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_AI_PROXY_URL: https://precipice-ai-proxy.precipice.workers.dev
      VITE_PUBLICATION_API_URL: ${{ vars.VITE_PUBLICATION_API_URL }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate deployment configuration
        env:
          WRANGLER_PUBLISH_CONFIG: ${{ secrets.WRANGLER_PUBLISH_CONFIG }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$VITE_PUBLICATION_API_URL"
          test -n "$VITE_TURNSTILE_SITE_KEY"
          test -n "$WRANGLER_PUBLISH_CONFIG"

      - name: Prepare publication Worker configuration
        env:
          WRANGLER_PUBLISH_CONFIG: ${{ secrets.WRANGLER_PUBLISH_CONFIG }}
        run: |
          umask 077
          # `migrations_dir` in the TOML is a path relative to the TOML file itself, not to the
          # working directory wrangler is invoked from. Writing the secret to $RUNNER_TEMP put it
          # outside the checkout, so wrangler resolved `worker/publish/migrations` against an
          # empty temp directory and found nothing. Writing it into the repo root — as
          # `wrangler.publish.toml`, the exact filename `.gitignore` already excludes — resolves
          # the same way a local `wrangler d1 migrations apply` run does.
          config_path="$GITHUB_WORKSPACE/wrangler.publish.toml"
          printf '%s\n' "$WRANGLER_PUBLISH_CONFIG" > "$config_path"
          echo "WRANGLER_PUBLISH_CONFIG_PATH=$config_path" >> "$GITHUB_ENV"

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Deploy AI proxy
        run: pnpm exec wrangler deploy

      - name: Apply publication database migrations
        run: pnpm exec wrangler d1 migrations apply precipice-publications --remote --config "$WRANGLER_PUBLISH_CONFIG_PATH"

      - name: Deploy publication Worker
        run: pnpm exec wrangler deploy --config "$WRANGLER_PUBLISH_CONFIG_PATH"

      - name: Deploy Pages
        run: pnpm exec wrangler pages deploy dist --project-name precipice --branch main
