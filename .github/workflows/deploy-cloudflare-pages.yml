name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VITE_AI_PROXY_URL: https://precipice-ai-proxy.precipice.workers.dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Update Worker secret
        run: printf '%s' "$ANTHROPIC_API_KEY" | pnpm dlx wrangler secret put ANTHROPIC_API_KEY --name precipice-ai-proxy

      - name: Deploy AI proxy
        run: pnpm dlx wrangler deploy

      - name: Deploy
        run: pnpm dlx wrangler pages deploy dist --project-name precipice --branch main
