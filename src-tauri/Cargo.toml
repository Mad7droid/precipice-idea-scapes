[package]
name = "precipice-desktop"
version = "0.1.3"
description = "Precipice for macOS"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
security-framework = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tauri-plugin-deep-link = "2.5"
toml_edit = "0.25"
