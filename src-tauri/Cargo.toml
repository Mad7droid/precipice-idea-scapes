[package]
name = "precipice-desktop"
version = "0.1.16"
description = "Precipice for macOS"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "=2.12.0", features = [] }
security-framework = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tauri-plugin-deep-link = "2.5"
toml_edit = "0.25"
# Local dictation: whisper.cpp with Metal, CoreAudio capture, model install from our R2.
whisper-rs = { version = "0.16", features = ["metal"] }
cpal = "0.18"
ureq = "3"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "process", "macros"] }
futures-util = "0.3"
